<!doctype html>
<html lang="ru" data-title="acc.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет — Key Man Academy</title>
  <meta name="description" content="Key Man Academy: online video courses for auto locksmiths — key cutting, transponders, immobilizers and programming. Lifetime access in your account.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f4fbf">
  <link rel="icon" href="https://keymanchicago.com/wp-content/uploads/2026/01/logo-logo-KM.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/academy.css">
</head>
<body data-page="account">

<!--#header-->
<header class="nav" id="nav">
  <div class="container nav__inner">
    <a href="/" class="logo" aria-label="Key Man Chicago — home">
      <img src="https://keymanchicago.com/wp-content/uploads/2026/01/logo-logo-KM.png" alt="" width="40" height="40" onerror="this.style.display='none'">
      <span>KEY<b>MAN</b></span>
    </a>
    <nav class="nav__links" id="navLinks">
      <a href="/" data-i18n="nav.home">Главная</a>
      <a href="/#services" data-i18n="nav.services">Услуги</a>
      <a href="/#work" data-i18n="nav.work">Наши работы</a>
      <a href="/academy" data-i18n="nav.courses" data-nav="catalog">Курсы</a>
      <a href="/#contacts" data-i18n="nav.contacts">Контакты</a>
    </nav>
    <div class="nav__actions">
      <div class="lang" id="langSwitch">
        <button class="lang__btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
          <span class="lang__code">RU</span>
          <i aria-hidden="true">▾</i>
        </button>
        <ul class="lang__menu" role="listbox">
          <li><button type="button" role="option" data-lang="ru"><b>RU</b> Русский</button></li>
          <li><button type="button" role="option" data-lang="en"><b>EN</b> English</button></li>
          <li><button type="button" role="option" data-lang="uk"><b>UA</b> Українська</button></li>
        </ul>
      </div>
      <a class="nav__acc" href="/account" data-nav="account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span data-i18n="nav.cabinet">Кабинет</span>
      </a>
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    </div>
  </div>
</header>
<!--/header-->

<main>
  <section class="pagehead">
    <div class="container">
      <span class="eyebrow">Key Man Academy</span>
      <h1 data-i18n="acc.h1">Личный кабинет</h1>
      <p data-i18n="acc.intro">Ваши курсы и профиль — в одном месте.</p>
    </div>
  </section>

  <section class="section section--grey section--tight">
    <div class="container">
      <div class="notice" id="payNotice" hidden></div>

      <!-- logged out -->
      <div class="auth" id="authBox" hidden>
        <div class="auth__tabs" role="tablist">
          <button type="button" class="is-active" data-auth="login" data-i18n="acc.login">Вход</button>
          <button type="button" data-auth="register" data-i18n="acc.register">Регистрация</button>
        </div>
        <form class="aform" id="loginForm" data-auth-pane="login" novalidate>
          <label><span data-i18n="acc.email">Email</span><input name="email" type="email" autocomplete="email" required></label>
          <label><span data-i18n="acc.password">Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
          <p class="aform__err" hidden></p>
          <button class="btn btn--primary btn--block" type="submit" data-i18n="acc.loginBtn">Войти</button>
          <p class="aform__hint" data-i18n="acc.forgot"></p>
        </form>
        <form class="aform" id="registerForm" data-auth-pane="register" novalidate hidden>
          <label><span data-i18n="acc.name">Имя</span><input name="name" autocomplete="name" required maxlength="80"></label>
          <label><span data-i18n="acc.email">Email</span><input name="email" type="email" autocomplete="email" required></label>
          <label><span data-i18n="acc.phone">Телефон</span><input name="phone" type="tel" autocomplete="tel" maxlength="40"></label>
          <label><span><span data-i18n="acc.password">Пароль</span> <small data-i18n="acc.pwHint">минимум 8 символов</small></span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
          <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <p class="aform__err" hidden></p>
          <button class="btn btn--primary btn--block" type="submit" data-i18n="acc.regBtn">Создать аккаунт</button>
        </form>
      </div>

      <!-- logged in -->
      <div class="cab" id="cabinet" hidden>
        <div class="cab__head">
          <h2 id="hello"></h2>
          <button class="btn btn--ghost btn--sm" id="logout" type="button" data-i18n="acc.logout">Выйти</button>
        </div>
        <h3 data-i18n="acc.my">Мои курсы</h3>
        <div class="clist" id="myCourses"></div>
        <div class="cempty" id="myEmpty" hidden>
          <p data-i18n="acc.none">У вас пока нет курсов.</p>
          <a href="/academy" class="btn btn--primary" data-i18n="acc.browse">Смотреть курсы</a>
        </div>
        <div class="cab__forms">
          <form class="aform" id="profileForm" novalidate>
            <h3 data-i18n="acc.profile">Профиль</h3>
            <label><span data-i18n="acc.email">Email</span><input name="email" type="email" disabled></label>
            <label><span data-i18n="acc.name">Имя</span><input name="name" maxlength="80"></label>
            <label><span data-i18n="acc.phone">Телефон</span><input name="phone" type="tel" maxlength="40"></label>
            <p class="aform__err" hidden></p>
            <button class="btn btn--primary" type="submit" data-i18n="acc.save">Сохранить</button>
          </form>
          <form class="aform" id="passwordForm" novalidate>
            <h3 data-i18n="acc.changePw">Сменить пароль</h3>
            <label><span data-i18n="acc.curPw">Текущий пароль</span><input name="password" type="password" autocomplete="current-password"></label>
            <label><span><span data-i18n="acc.newPw">Новый пароль</span> <small data-i18n="acc.pwHint"></small></span><input name="newPassword" type="password" autocomplete="new-password" minlength="8"></label>
            <p class="aform__err" hidden></p>
            <button class="btn btn--primary" type="submit" data-i18n="acc.changePw">Сменить пароль</button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<!--#footer-->
<footer class="footer">
  <div class="container footer__inner">
    <a href="/" class="logo"><span>KEY<b>MAN</b></span></a>
    <p data-i18n="ft.copy">© 2026 Key Man Chicago.</p>
    <div class="footer__links">
      <a href="https://keymanchicago.com/privacy" data-i18n="ft.privacy">Privacy policy</a>
      <a href="https://www.youtube.com/@KeyManChicago" target="_blank" rel="noopener">YouTube</a>
      <a href="https://www.instagram.com/keyman.chicago" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</footer>
<!--/footer-->

<script src="/i18n.js"></script>
<script src="/academy.js"></script>
</body>
</html>
