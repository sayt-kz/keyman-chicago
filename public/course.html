<!doctype html>
<html lang="ru" data-title="acd.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Курс — Key Man Academy</title>
  <meta name="description" content="Key Man Academy: online video courses for auto locksmiths — key cutting, transponders, immobilizers and programming. Lifetime access in your account.">
  <meta name="theme-color" content="#1f4fbf">
  <link rel="icon" href="https://keymanchicago.com/wp-content/uploads/2026/01/logo-logo-KM.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/academy.css">
</head>
<body data-page="course">

<!--#header-->
<header class="nav" id="nav">
  <div class="container nav__inner">
    <a href="/" class="logo" aria-label="Key Man Chicago — home">
      <img src="https://keymanchicago.com/wp-content/uploads/2026/01/logo-logo-KM.png" alt="" width="40" height="40" onerror="this.style.display='none'">
      <span>KEY<b>MAN</b></span>
    </a>
    <nav class="nav__links" id="navLinks">
      <a href="/" data-i18n="nav.home">Главная</a>
      <a href="/#services" data-i18n="nav.services">Услуги</a>
      <a href="/#work" data-i18n="nav.work">Наши работы</a>
      <a href="/academy" data-i18n="nav.courses" data-nav="catalog">Курсы</a>
      <a href="/#contacts" data-i18n="nav.contacts">Контакты</a>
    </nav>
    <div class="nav__actions">
      <div class="lang" id="langSwitch">
        <button class="lang__btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
          <span class="lang__code">RU</span>
          <i aria-hidden="true">▾</i>
        </button>
        <ul class="lang__menu" role="listbox">
          <li><button type="button" role="option" data-lang="ru"><b>RU</b> Русский</button></li>
          <li><button type="button" role="option" data-lang="en"><b>EN</b> English</button></li>
          <li><button type="button" role="option" data-lang="uk"><b>UA</b> Українська</button></li>
        </ul>
      </div>
      <a class="nav__acc" href="/account" data-nav="account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span data-i18n="nav.cabinet">Кабинет</span>
      </a>
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    </div>
  </div>
</header>
<!--/header-->

<main>
  <section class="pagehead pagehead--course">
    <div class="container chero" id="courseHead">
      <div>
        <a class="chero__back" href="/academy" data-i18n="crs.back">← Все курсы</a>
        <span class="eyebrow" id="cLevel">Key Man Academy</span>
        <h1 id="cTitle">&nbsp;</h1>
        <p id="cDesc"></p>
      </div>
      <aside class="buybox" id="buyBox" hidden>
        <img class="buybox__cover" id="cCover" alt="" hidden>
        <div class="buybox__price" id="cPrice"></div>
        <p class="buybox__meta"><span id="cCount"></span> · <span data-i18n="crs.access">Доступ навсегда</span></p>
        <button class="btn btn--primary btn--block" id="buyBtn" type="button"></button>
        <p class="buybox__note" id="buyNote" hidden></p>
      </aside>
    </div>
  </section>

  <section class="section section--grey section--tight" id="lessons">
    <div class="container player">
      <div class="player__main">
        <div class="player__screen" id="screen">
          <video id="video" controls playsinline preload="metadata" controlslist="nodownload" disablepictureinpicture hidden></video>
          <div class="player__msg" id="screenMsg">Выберите урок из списка</div>
        </div>
        <h2 class="player__title" id="lTitle"></h2>
        <p class="player__desc" id="lDesc"></p>
      </div>
      <aside class="player__list">
        <h3 data-i18n="crs.program">Программа курса</h3>
        <ol id="lessonList"></ol>
      </aside>
    </div>
  </section>
</main>

<!--#footer-->
<footer class="footer">
  <div class="container footer__inner">
    <a href="/" class="logo"><span>KEY<b>MAN</b></span></a>
    <p data-i18n="ft.copy">© 2026 Key Man Chicago.</p>
    <div class="footer__links">
      <a href="https://keymanchicago.com/privacy" data-i18n="ft.privacy">Privacy policy</a>
      <a href="https://www.youtube.com/@KeyManChicago" target="_blank" rel="noopener">YouTube</a>
      <a href="https://www.instagram.com/keyman.chicago" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</footer>
<!--/footer-->

<script src="/i18n.js"></script>
<script src="/academy.js"></script>
</body>
</html>
